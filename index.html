<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRANY1 - Horror Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }
        
        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .active {
            display: flex;
        }

        /* Menu Screen */
        #menu-screen {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
        }
        .menu-title {
            position: absolute;
            right: 8%;
            top: 15%;
            font-size: 5rem;
            font-weight: bold;
            color: #d1d1d1;
            text-shadow: 0 0 20px #000, 2px 2px 5px #ff0000;
            letter-spacing: 5px;
            font-family: serif;
        }
        .menu-buttons {
            position: absolute;
            left: 10%;
            top: 30%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .menu-btn {
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-size: 2rem;
            font-family: serif;
            text-align: left;
            cursor: pointer;
            text-shadow: 2px 2px 4px #000;
            transition: 0.2s;
        }
        .menu-btn:hover {
            color: #ff3333;
            transform: scale(1.05);
        }
        .remove-ads {
            position: absolute;
            right: 20px;
            bottom: 20px;
            border: 1px solid #fff;
            padding: 8px 15px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.5);
        }

        /* Options Screen */
        #options-screen {
            background: #111;
            justify-content: flex-start;
            padding: 30px;
        }
        .options-header {
            font-size: 3rem;
            font-style: italic;
            font-family: serif;
            margin-bottom: 20px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 80%;
            max-width: 800px;
        }
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-group label {
            font-size: 1.5rem;
            font-family: serif;
            color: #d1d1d1;
        }
        .option-group select {
            padding: 8px;
            font-size: 1.2rem;
            background: #222;
            color: #fff;
            border: 1px solid #555;
        }
        .difficulty-box {
            margin-top: 20px;
            border: 1px solid #fff;
            padding: 15px;
            width: 80%;
            max-width: 800px;
            background: rgba(255,255,255,0.05);
        }
        .options-footer {
            position: absolute;
            bottom: 20px;
            width: 90%;
            display: flex;
            justify-content: space-between;
        }

        /* Game Screen */
        #game-screen {
            background: #151515;
            perspective: 800px;
        }
        .room-view {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle, #2a2522 0%, #0d0a08 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .room-walls {
            width: 80%;
            height: 80%;
            border: 5px solid #36291f;
            background: #4a3b32;
            position: relative;
            box-shadow: inset 0 0 50px #000;
        }
        /* HUD */
        .hud-top-left {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .icon-btn {
            background: #222;
            border: 2px solid #fff;
            padding: 10px;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .player-status {
            font-size: 2rem;
        }
        .joystick-area {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .joystick-knob {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            position: absolute;
        }
        .action-btn-right {
            position: absolute;
            bottom: 40px;
            right: 40px;
            padding: 15px 25px;
            background: #500;
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Jumpscare Overlay */
        #jumpscare-screen {
            background: #000;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #jumpscare-screen img {
            width: 80%;
            max-width: 500px;
            border: 5px solid red;
            animation: shake 0.1s infinite;
        }
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            20% { transform: translate(-2px, -3px) rotate(-1deg); }
            40% { transform: translate(-3px, 2px) rotate(1deg); }
            60% { transform: translate(3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, 2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <!-- 1. MAIN MENU -->
    <div id="menu-screen" class="screen active">
        <div class="menu-title">GRANNY</div>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="startGame()">PLAY</button>
            <button class="menu-btn" onclick="openOptions()">OPTIONS</button>
            <button class="menu-btn" onclick="alert('GRANY1 - Created for you!')">MORE GAMES</button>
            <button class="menu-btn" onclick="window.close()">QUIT</button>
        </div>
        <div class="remove-ads">Remove Ads</div>
    </div>

    <!-- 2. OPTIONS SCREEN -->
    <div id="options-screen" class="screen">
        <div class="options-header">Options</div>
        <div class="options-grid">
            <div class="option-group">
                <label>Difficulty</label>
                <select id="diff-select" onchange="updateDiff()">
                    <option value="Easy">Easy</option>
                    <option value="Normal" selected>Normal</option>
                    <option value="Hard">Hard</option>
                    <option value="Extreme">Extreme</option>
                </select>
            </div>
            <div class="option-group">
                <label>Game Theme</label>
                <select>
                    <option>Default (Snow/Dark)</option>
                    <option>Classic</option>
                </select>
            </div>
            <div class="option-group">
                <label>Quality</label>
                <select>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </div>
        </div>
        <div class="difficulty-box" id="diff-desc">
            <strong>Difficulty: Normal</strong><br>*Opportunity to get a bonus day.
        </div>
        <div class="options-footer">
            <button class="icon-btn" onclick="closeOptions()">&lt; Back</button>
            <button class="icon-btn" onclick="closeOptions()">Continue &gt;</button>
        </div>
    </div>

    <!-- 3. GAMEPLAY SCREEN -->
    <div id="game-screen" class="screen">
        <div class="room-view">
            <div class="room-walls">
                <div style="position: absolute; top: 40%; left: 40%; color: #888; font-size: 1.5rem;" id="granny-status">Uyni qidirmoqda... Day: <span id="day-count">1</span>/5</div>
            </div>
        </div>
        
        <div class="hud-top-left">
            <div class="player-status">👤</div>
            <button class="icon-btn" onclick="openOptions()">⚙️</button>
        </div>

        <div class="joystick-area" id="joystick">
            <div class="joystick-knob" id="knob"></div>
        </div>

        <button class="action-btn-right" onclick="makeNoise()">Shovqin chiqarish! 🔊</button>
    </div>

    <!-- 4. JUMPSCARE SCREEN -->
    <div id="jumpscare-screen" class="screen">
        <h1 style="color: red; font-size: 3rem;">GRANNY SENINGIZNI TOPDI!</h1>
        <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=500&auto=format&fit=crop" alt="Granny">
        <p style="margin-top: 20px; font-size: 1.5rem;">Qolgan kunlar: <span id="days-left">4</span></p>
        <button class="action-btn-right" style="position:static; margin-top:20px;" onclick="restartDay()">Davom etish</button>
    </div>

    <script>
        let currentDay = 1;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            showScreen('game-screen');
            startGrannyAI();
        }

        function openOptions() {
            showScreen('options-screen');
        }

        function closeOptions() {
            showScreen('menu-screen');
        }

        function updateDiff() {
            let val = document.getElementById('diff-select').value;
            let desc = document.getElementById('diff-desc');
            if(val === 'Easy') desc.innerHTML = `<strong>Difficulty: Easy</strong><br>*Granny is slower, extra days.`;
            if(val === 'Normal') desc.innerHTML = `<strong>Difficulty: Normal</strong><br>*Opportunity to get a bonus day.`;
            if(val === 'Hard') desc.innerHTML = `<strong>Difficulty: Hard</strong><br>*Granny is fast, fewer items.`;
            if(val === 'Extreme') desc.innerHTML = `<strong>Difficulty: Extreme</strong><br>*No mercy, extreme speed.`;
        }

        function makeNoise() {
            document.getElementById('granny-status').innerText = "⚠️ Granny tovushni eshitib yugurib keldi!";
            setTimeout(() => {
                triggerJumpscare();
            }, 1200);
        }

        function startGrannyAI() {
            // Tasodifiy vaqtda Granny hujum qilishi mumkin
            setTimeout(() => {
                if(document.getElementById('game-screen').classList.contains('active')) {
                    triggerJumpscare();
                }
            }, 15000);
        }

        function triggerJumpscare() {
            showScreen('jumpscare-screen');
            document.getElementById('days-left').innerText = (5 - currentDay);
        }

        function restartDay() {
            currentDay++;
            if(currentDay > 5) {
                alert("O'yin tugadi! Granny sizni yutdi.");
                currentDay = 1;
                showScreen('menu-screen');
            } else {
                document.getElementById('day-count').innerText = currentDay;
                showScreen('game-screen');
                startGrannyAI();
            }
        }
    </script>
</body>
</html>
