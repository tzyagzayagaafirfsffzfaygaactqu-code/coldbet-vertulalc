<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COLDBET — Qishki Sport va Jonli Efir</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        obsidian: '#050a14',
                        charcoal: '#0a1426',
                        ice: '#38bdf8',
                        frost: '#e0f2fe',
                    },
                    boxShadow: {
                        'ice-glow': '0 0 24px rgba(56, 189, 248, 0.38)',
                        'ice-sm': '0 0 12px rgba(224, 242, 254, 0.35)',
                        'frost-card': '0 8px 28px 0 rgba(2, 10, 24, 0.8)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top, #0b1c36 0%, #050a14 70%, #02050a 100%);
            color: #f0f9ff;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Frosted Glassmorphism */
        .glass-panel {
            background: linear-gradient(180deg, rgba(13, 27, 50, 0.92) 0%, rgba(6, 13, 26, 0.96) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(224, 242, 254, 0.16);
        }
        .glass-card {
            position: relative;
            background: linear-gradient(145deg, rgba(18, 37, 66, 0.78) 0%, rgba(8, 17, 34, 0.92) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(224, 242, 254, 0.2);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.14), 0 8px 24px rgba(2, 8, 18, 0.7);
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(224, 242, 254, 0.55), transparent);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }
        .odd-btn {
            background: linear-gradient(180deg, rgba(14, 29, 52, 0.95) 0%, rgba(8, 16, 32, 0.98) 100%);
            border: 1px solid rgba(186, 230, 253, 0.2);
            transition: all 0.16s ease;
        }
        .odd-btn:active {
            transform: scale(0.95);
        }
        .odd-btn.selected {
            background: linear-gradient(135deg, #e0f2fe 0%, #38bdf8 55%, #0284c7 100%);
            color: #040914;
            border-color: #ffffff;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
        }
        .odd-btn.selected .odd-label {
            color: #051326;
            font-weight: 800;
        }
        @keyframes pulse-live {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(1.25); }
        }
        .live-dot {
            animation: pulse-live 1.4s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen bg-[#03060d] overflow-x-hidden">

    <!-- Mobile App Shell -->
    <div class="w-full max-w-md bg-obsidian min-h-screen flex flex-col relative shadow-2xl border-x border-sky-200/15 overflow-x-hidden pb-24">

        <!-- Falling Snow Canvas -->
        <canvas id="snow-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-40"></canvas>

        <!-- 1. TOP HEADER -->
        <header class="sticky top-0 z-30 glass-panel px-3.5 py-3 flex items-center justify-between border-b border-sky-200/15">
            <!-- Brand Logo -->
            <div onclick="navigateTo('sports', 'football')" class="flex items-center gap-2 cursor-pointer">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-white via-sky-300 to-sky-600 flex items-center justify-center shadow-ice-sm border border-white/60">
                    <i class="fa-solid fa-snowflake text-obsidian text-lg animate-spin" style="animation-duration: 16s;"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider text-white leading-none">
                        COLD<span class="text-ice">BET</span>
                    </h1>
                    <span class="text-[9px] text-sky-200/80 font-semibold tracking-widest uppercase">Qishki Arena</span>
                </div>
            </div>

            <!-- Snow Toggle & User Balance (+ To'ldirish) -->
            <div class="flex items-center gap-1.5">
                <button type="button" onclick="toggleSnow()" id="snow-toggle-btn" title="Qor yog'ishini yoqish/o'chirish"
                    class="w-8 h-8 rounded-xl bg-sky-400/20 border border-sky-200/30 text-sky-100 hover:bg-sky-400/30 flex items-center justify-center transition active:scale-90">
                    <i class="fa-solid fa-snowflake text-xs"></i>
                </button>

                <div class="flex items-center gap-1.5 bg-charcoal/95 border border-sky-200/25 rounded-2xl p-1 pl-2.5 shadow-inner">
                    <div class="text-right">
                        <div class="text-[9px] text-sky-200/70 leading-none">Balans</div>
                        <div id="user-balance" class="text-[11px] font-extrabold text-white tracking-tight">500 000 <span class="text-ice text-[10px]">UZS</span></div>
                    </div>
                    <button type="button" onclick="instantTopUp()" class="bg-gradient-to-r from-sky-200 to-ice hover:from-white hover:to-sky-300 text-obsidian font-extrabold text-[11px] px-2.5 py-1.5 rounded-xl transition flex items-center gap-1 shadow-ice-sm active:scale-95">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span>To‘ldirish</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 3. EXPANDABLE LIVE STREAM VIDEO PLAYER -->
        <section id="live-player-container" class="hidden px-3.5 pt-3 z-25">
            <div class="rounded-2xl overflow-hidden bg-[#040914] border-2 border-sky-200/40 shadow-ice-glow">
                <div id="player-screen" class="relative w-full h-48 bg-gradient-to-b from-[#0b2240] via-[#061224] to-[#030811] overflow-hidden select-none">
                    <!-- Top Player Overlay -->
                    <div class="absolute top-2.5 left-3 right-3 z-20 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-rose-600 text-white text-[10px] font-black uppercase tracking-wider shadow">
                                <span class="w-1.5 h-1.5 rounded-full bg-white live-dot"></span> JONLI EFIR
                            </span>
                            <span class="px-2 py-0.5 rounded-md bg-slate-900/80 border border-sky-200/20 text-sky-100 text-[10px] font-bold flex items-center gap-1">
                                <i class="fa-solid fa-eye text-ice"></i> <span id="player-viewers">28,450</span>
                            </span>
                        </div>
                        <button type="button" onclick="closeLivePlayer()" class="w-7 h-7 rounded-lg bg-rose-500/90 hover:bg-rose-600 text-white text-xs flex items-center justify-center shadow transition active:scale-90">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Animated Sport Canvas -->
                    <canvas id="stream-canvas" class="w-full h-full block"></canvas>

                    <!-- Scoreboard Overlay -->
                    <div class="absolute bottom-2.5 left-3 right-3 z-20 glass-panel rounded-xl px-3 py-1.5 flex items-center justify-between border border-sky-200/25">
                        <div class="flex items-center gap-1.5 max-w-[38%]">
                            <span id="player-icon1" class="text-sm">🇺🇿</span>
                            <span id="player-team1" class="text-xs font-extrabold text-white truncate">O'zbekiston</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span id="player-score" class="text-sm font-black text-sky-200 tracking-wider leading-none">1 : 0</span>
                            <span id="player-time" class="text-[9px] text-rose-400 font-bold mt-0.5">64:18</span>
                        </div>
                        <div class="flex items-center justify-end gap-1.5 max-w-[38%]">
                            <span id="player-team2" class="text-xs font-extrabold text-white truncate">Eron</span>
                            <span id="player-icon2" class="text-sm">🇮🇷</span>
                        </div>
                    </div>
                </div>

                <!-- Live Commentary Ticker -->
                <div class="bg-[#081529] px-3 py-2 flex items-center justify-between text-[11px] border-t border-sky-200/15">
                    <div class="flex items-center gap-1.5 text-sky-100 truncate">
                        <i class="fa-solid fa-snowflake text-ice"></i>
                        <span id="player-commentary" class="truncate font-medium">Jonli translyatsiya ketmoqda...</span>
                    </div>
                    <span class="text-[10px] font-bold text-sky-200 bg-sky-400/15 px-1.5 py-0.5 rounded border border-sky-300/25 whitespace-nowrap ml-2">FROST HD</span>

                    ⚽ Futbol
                </button>
                <button type="button" onclick="selectCategory('combat')" id="tab-combat" class="sport-tab py-2 px-3.5 rounded-xl text-xs font-semibold bg-charcoal text-sky-100 border border-sky-200/20 transition flex items-center gap-1.5 whitespace-nowrap">
                    🥊 Kurash / MMA
                </button>
                <button type="button" onclick="selectCategory('basketball')" id="tab-basketball" class="sport-tab py-2 px-3.5 rounded-xl text-xs font-semibold bg-charcoal text-sky-100 border border-sky-200/20 transition flex items-center gap-1.5 whitespace-nowrap">
                    🏀 Basketbol
                </button>
                <button type="button" onclick="selectCategory('tennis')" id="tab-tennis" class="sport-tab py-2 px-3.5 rounded-xl text-xs font-semibold bg-charcoal text-sky-100 border border-sky-200/20 transition flex items-center gap-1.5 whitespace-nowrap">
                    🎾 Tennis
                </button>
                <button type="button" onclick="selectCategory('esports')" id="tab-esports" class="sport-tab py-2 px-3.5 rounded-xl text-xs font-semibold bg-charcoal text-sky-100 border border-sky-200/20 transition flex items-center gap-1.5 whitespace-nowrap">
                    🎮 Kibersport
                </button>
                <button type="button" onclick="selectCategory('minigames')" id="tab-minigames" class="sport-tab py-2 px-3.5 rounded-xl text-xs font-semibold bg-charcoal text-amber-300 border border-amber-400/35 transition flex items-center gap-1.5 whitespace-nowrap">
                    🎲 Tezkor O‘yinlar
                </button>
            </div>
        </div>

        <!-- MAIN DYNAMIC CONTENT -->
        <main id="main-content" class="flex-1 px-3.5 pt-3 space-y-3 relative z-10">
            <!-- Rendered by JS -->
        </main>

        <!-- 5. FLOATING BET SLIP (KUPON) BAR -->

                <div class="flex items-center gap-2.5">
                    <span id="floating-count" class="w-7 h-7 rounded-xl bg-obsidian text-ice font-black text-sm flex items-center justify-center">0</span>
                    <div class="text-left">
                        <div class="text-xs font-black uppercase tracking-wide">Muzdek Kupon (Bet Slip)</div>

                    </div>

                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-ticket text-ice text-lg"></i>
                        <h3 class="text-base font-extrabold text-white">Kupon (Bet Slip)</h3>

                    <div class="flex items-center gap-3">

                <div id="coupon-items-list" class="flex-1 overflow-y-auto py-3 space-y-2.5 no-scrollbar min-h-[110px]"></div>

                <!-- Stake Input & Payout -->
                <div id="coupon-footer" class="pt-3 border-t border-sky-200/15 space-y-3">
                    <div>
                        <div class="flex justify-between text-xs text-sky-200/75 mb-1.5">
                            <span>Stavka summasi (UZS)</span>
                            <button type="button" onclick="setQuickStake(balance)" class="text-ice font-bold hover:underline">Maksimal</button>
                        </div>
                        <div class="relative">
                            <input type="number" id="stake-input" value="50000" min="1000" step="1000" oninput="recalculatePayout()"
                                class="w-full bg-obsidian border border-sky-200/30 focus:border-ice rounded-xl px-4 py-2.5 text-white font-extrabold text-base outline-none">
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-sky-200/60">UZS</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mt-2">
                            <button type="button" onclick="setQuickStake(10000)" class="py-1.5 rounded-lg bg-slate-900 hover:bg-sky-900/40 text-xs font-bold text-sky-100 border border-sky-200/20">10 000</button>
                            <button type="button" onclick="setQuickStake(50000)" class="py-1.5 rounded-lg bg-slate-900 hover:bg-sky-900/40 text-xs font-bold text-sky-100 border border-sky-200/20">50 000</button>
                            <button type="button" onclick="setQuickStake(100000)" class="py-1.5 rounded-lg bg-slate-900 hover:bg-sky-900/40 text-xs font-bold text-sky-100 border border-sky-200/20">100 000</button>
                        </div>
                    </div>

                    <div class="bg-obsidian/90 rounded-2xl p-3 border border-sky-200/20 space-y-1.5">
                        <div class="flex justify-between text-xs">
                            <span class="text-sky-200/70">Umumiy koeffitsiyent:</span>
                            <span id="total-odds-display" class="font-extrabold text-ice">1.00</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-sky-100 font-semibold">Kutilayotgan yutuq:</span>
                            <span id="potential-win-display" class="font-black text-emerald-400">0 UZS</span>
                        </div>
                    </div>

                    <button type="button" onclick="placeCouponBet()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-sky-100 via-ice to-sky-500 text-obsidian font-black text-sm uppercase tracking-wider shadow-ice-glow border border-white/60 active:scale-[0.98] transition">
                        Stavka tikish
                    </button>
                </div>
            </div>
        </div>

        <!-- TOAST NOTIFICATION -->
        <div id="toast-box" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 w-[92%] max-w-sm">
            <div id="toast-inner" class="glass-panel border border-sky-200/40 text-white px-4 py-3 rounded-2xl shadow-ice-glow flex items-center gap-3 text-xs font-bold">
                <i id="toast-icon" class="fa-solid fa-snowflake text-ice text-base"></i>
                <span id="toast-message">Xabar</span>
            </div>
        </div>

    </div>

        let toastTimer = null;
        function showToast(msg, type = 'success') {
            const box = document.getElementById('toast-box');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-message');
            const inner = document.getElementById('toast-inner');

            text.textContent = msg;
            if (type === 'error') {
                icon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-base';
                inner.style.borderColor = 'rgba(244, 63, 94, 0.55)';
            } else {
                icon.className = 'fa-solid fa-snowflake text-ice text-base';
                inner.style.borderColor = 'rgba(186, 230, 253, 0.45)';
            }

            box.classList.remove('opacity-0');
            box.classList.add('opacity-100');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                box.classList.remove('opacity-100');
                box.classList.add('opacity-0');
            }, 2500);
        }

        // --- FALLING SNOW ANIMATION ---
        function initSnowfall() {
            const canvas = document.getElementById('snow-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let flakes = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 55; i++) {
                flakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2.3 + 0.8,
                    vy: Math.random() * 0.85 + 0.35,
                    vx: Math.random() * 0.4 - 0.2,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (snowEnabled) {
                    for (let i = 0; i < flakes.length; i++) {
                        const f = flakes[i];
                        ctx.beginPath();
                        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(224, 242, 254, ${f.alpha})`;
                        ctx.fill();

                        f.y += f.vy;
                        f.x += f.vx + Math.sin(f.y * 0.015) * 0.25;
                        if (f.y > canvas.height) {
                            f.y = -5;
                            f.x = Math.random() * canvas.width;
                        }
                        if (f.x > canvas.width) f.x = 0;
                        if (f.x < 0) f.x = canvas.width;
                    }
                }
                requestAnimationFrame(loop);
            }
            loop();
        }

        function toggleSnow() {
            snowEnabled = !snowEnabled;
            const btn = document.getElementById('snow-toggle-btn');
            if (snowEnabled) {
                btn.classList.remove('opacity-50');
                showToast("Qor yog'ishi yoqildi ❄️");
            } else {
                btn.classList.add('opacity-50');
                showToast("Qor effekti o'chirildi");
            }
        }

        function startSportCanvasAnimation(category) {
            cancelAnimationFrame(streamAnimId);
            const canvas = document.getElementById('stream-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            canvas.width = canvas.parentElement.clientWidth || 380;
            canvas.height = canvas.parentElement.clientHeight || 192;

            let t = 0;
            let ball = { x: canvas.width * 0.5, y: canvas.height * 0.5, vx: 2.2, vy: 1.5 };

            // Helper to draw realistic player silhouette
            function drawPlayer(x, y, teamColor, numberText, isGoalie = false) {
                ctx.save();
                ctx.translate(x, y);

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.beginPath();
                ctx.ellipse(0, 16, 8, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body / Jersey
                ctx.fillStyle = teamColor;
                ctx.beginPath();
                ctx.roundRect(-6, -6, 12, 14, 3);
                ctx.fill();

                // Jersey Number
                if (numberText) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 8px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(numberText, 0, 3);
                }

                // Head
                ctx.fillStyle = '#fcd34d'; // Skin tone
                ctx.beginPath();
                ctx.arc(0, -12, 4.5, 0, Math.PI * 2);
                ctx.fill();

                // Legs (animated)
                ctx.strokeStyle = teamColor;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                
                let legCycle = Math.sin(t * 8) * 4;
                // Left leg
                ctx.beginPath();
                ctx.moveTo(-3, 8);
                ctx.lineTo(-4 - legCycle, 16);
                ctx.stroke();

                // Right leg
                ctx.beginPath();
                ctx.moveTo(3, 8);
                ctx.lineTo(4 + legCycle, 16);
                ctx.stroke();

                ctx.restore();
            }

            // Helper to draw Referee
            function drawReferee(x, y) {
                ctx.save();
                ctx.translate(x, y);
                // Black/White striped jersey
                ctx.fillStyle = '#111827';
                ctx.beginPath();
                ctx.roundRect(-5, -6, 10, 13, 2);
                ctx.fill();

                ctx.fillStyle = '#fcd34d';
                ctx.beginPath();
                ctx.arc(0, -11, 4, 0, Math.PI * 2);
                ctx.fill();

                // Yellow card in hand
                ctx.fillStyle = '#facc15';
                ctx.fillRect(4, -8, 3, 5);
                ctx.restore();
            }

            function animate() {
                t += 0.035;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (category === 'football') {
                    // Stadium Field Background
                    ctx.fillStyle = '#0a2318';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Field Markings
                    ctx.strokeStyle = 'rgba(224, 242, 254, 0.4)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(16, 20, canvas.width - 32, canvas.height - 40);

                    // Center line
                    ctx.beginPath();
                    ctx.moveTo(canvas.width / 2, 20);
                    ctx.lineTo(canvas.width / 2, canvas.height - 20);
                    ctx.stroke();

                    // Center circle
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, canvas.height / 2, 22, 0, Math.PI * 2);
                    ctx.stroke();

                    // Penalty areas
                    ctx.strokeRect(16, canvas.height / 2 - 28, 22, 56);
                    ctx.strokeRect(canvas.width - 38, canvas.height / 2 - 28, 22, 56);

                    // Goals
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(8, canvas.height / 2 - 18, 8, 36);
                    ctx.strokeRect(canvas.width - 16, canvas.height / 2 - 18, 8, 36);

                    // Ball movement
                    ball.x += ball.vx + Math.sin(t) * 0.5;
                    ball.y += ball.vy + Math.cos(t * 1.3) * 0.4;
                    if (ball.x < 24 || ball.x > canvas.width - 24) ball.vx *= -1;
                    if (ball.y < 26 || ball.y > canvas.height - 26) ball.vy *= -1;

                    // Goalie 1 (Team 1 - Blue/White)
                    drawPlayer(24, canvas.height / 2 + Math.sin(t * 2) * 12, '#38bdf8', '1', true);
                    // Goalie 2 (Team 2 - Red/White)
                    drawPlayer(canvas.width - 24, canvas.height / 2 + Math.cos(t * 2) * 12, '#f43f5e', '12', true);

                    // Field Players Team 1 (Blue)
                    drawPlayer(canvas.width * 0.32 + Math.sin(t) * 15, canvas.height * 0.3 + Math.cos(t * 1.5) * 10, '#38bdf8', '10');
                    drawPlayer(canvas.width * 0.38 + Math.cos(t * 0.9) * 12, canvas.height * 0.7 + Math.sin(t) * 12, '#38bdf8', '7');
                    drawPlayer(canvas.width * 0.25 + Math.sin(t * 1.2) * 10, canvas.height * 0.5 + Math.cos(t) * 15, '#38bdf8', '9');

                    // Field Players Team 2 (Red)
                    drawPlayer(canvas.width * 0.62 + Math.cos(t) * 15, canvas.height * 0.35 + Math.sin(t * 1.4) * 10, '#f43f5e', '11');
                    drawPlayer(canvas.width * 0.68 + Math.sin(t * 0.8) * 12, canvas.height * 0.65 + Math.cos(t) * 12, '#f43f5e', '8');
                    drawPlayer(canvas.width * 0.75 + Math.cos(t * 1.1) * 10, canvas.height * 0.5 + Math.sin(t * 1.3) * 15, '#f43f5e', '10');

                    // Referee
                    drawReferee(canvas.width * 0.5 + Math.sin(t * 0.5) * 25, canvas.height * 0.25 + Math.cos(t * 0.7) * 20);

                    // Animated Ball
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                } else if (category === 'combat') {
                    ctx.fillStyle = '#080e1a';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const rx = Math.min(canvas.width * 0.38, 130);
                    const ry = 55;

                    ctx.fillStyle = '#111b2e';
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    drawPlayer(cx - 24 + Math.sin(t * 2.5) * 12, cy + Math.cos(t * 2) * 6, '#38bdf8', 'MMA');
                    drawPlayer(cx + 24 + Math.sin(t * 2.5 + 1) * 12, cy + Math.cos(t * 2 + 1) * 6, '#f43f5e', 'UFC');

                } else if (category === 'basketball') {
                    ctx.fillStyle = '#141019';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.strokeStyle = 'rgba(251, 191, 36, 0.45)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

                    drawPlayer(canvas.width * 0.35 + Math.sin(t) * 20, canvas.height * 0.5, '#f59e0b', '23');
                    drawPlayer(canvas.width * 0.65 + Math.cos(t) * 20, canvas.height * 0.5, '#38bdf8', '30');

                } else if (category === 'tennis') {
                    ctx.fillStyle = '#071b34';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.strokeStyle = 'rgba(224, 242, 254, 0.55)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(24, 24, canvas.width - 48, canvas.height - 48);

                    drawPlayer(canvas.width * 0.3, canvas.height / 2 + Math.sin(t * 2) * 25, '#bef264', '1');
                    drawPlayer(canvas.width * 0.7, canvas.height / 2 + Math.cos(t * 2) * 25, '#38bdf8', '2');

                } else {
                    // Esports
                    ctx.fillStyle = '#060a14';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 48, 0, Math.PI * 2);
                    ctx.stroke();

                    drawPlayer(cx - 30, cy, '#38bdf8', 'CS');
                    drawPlayer(cx + 30, cy, '#f43f5e', 'G2');
                }

                streamAnimId = requestAnimationFrame(animate);
            }
            animate();
        }

        // --- BET SLIP (KUPON) LOGIC ---
        function toggleOdd(matchId, code) {
            const match = matchesData.find(m => m.id === matchId);
            if (!match) return;
            const market = match.markets.find(mk => mk.code === code);
            if (!market) return;

            const idx = coupon.findIndex(c => c.matchId === matchId);
            if (idx !== -1) {
                if (coupon[idx].code === code) {
                    coupon.splice(idx, 1);
                } else {
                    coupon[idx] = {
                        matchId: match.id,
                        matchTitle: `${match.team1} — ${match.team2}`,
                        code: market.code,
                        marketLabel: market.label,
                        odd: market.odd
                    };
                }
            } else {
                coupon.push({
                    matchId: match.id,
                    matchTitle: `${match.team1} — ${match.team2}`,
                    code: market.code,
                    marketLabel: market.label,
                    odd: market.odd
                });
            }

            updateCouponFloatingBar();
            if (activeView === 'sports') {
                renderMatchesView(activeCategory);
            }
        }

        function updateCouponFloatingBar() {
            const bar = document.getElementById('floating-coupon-bar');
            if (coupon.length > 0) {
                const totalOdd = coupon.reduce((acc, item) => acc * item.odd, 1);
                bar.classList.remove('hidden');
                document.getElementById('floating-count').textContent = coupon.length;
                document.getElementById('floating-odds-text').textContent = `Umumiy koeff: ${totalOdd.toFixed(2)}`;
            } else {
                bar.classList.add('hidden');
            }
        }

        function recalculatePayout() {
            const stake = parseFloat(document.getElementById('stake-input').value) || 0;
            const totalOdd = coupon.reduce((acc, item) => acc * item.odd, 1);
            const payout = stake * totalOdd;

            document.getElementById('total-odds-display').textContent = totalOdd.toFixed(2);
            document.getElementById('potential-win-display').textContent = `${formatUZS(payout)} UZS`;

            coupon = [];

            closeBetSlipDrawer();

            showToast("Stavkangiz muvaffaqiyatli qabul qilindi! ❄️");

        function logMiniGameHistory(gameName, stake, multiplier, winAmount) {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            historyLog.unshift({
                type: 'minigame',
                id: 'MG-' + Math.floor(10000 + Math.random() * 90000),
                time: `Bugun, ${timeStr}`,
                title: gameName,
                stake: stake,
                odd: `${multiplier}x`,
                resultText: winAmount > 0 ? `+${formatUZS(winAmount)} UZS` : '0 UZS',
                statusColor: winAmount > 0 ? 'text-emerald-400' : 'text-rose-400'
            });
            updateHistoryBadge();
        }

        function playIceDice(choice) {
            const stake = parseFloat(document.getElementById('dice-stake').value) || 0;
            if (stake < 1000) return showToast("Minimal stavka 1 000 UZS!", "error");
            if (stake > balance) return showToast("Balansda mablag' yetarli emas!", "error");

            balance -= stake;
            updateBalanceDisplay();

            const roll = Math.floor(Math.random() * 6) + 1;
            const diceEl = document.getElementById('dice-visual');
            const statusEl = document.getElementById('dice-status');
            diceEl.style.transform = 'rotate(360deg) scale(1.1)';
            setTimeout(() => { diceEl.style.transform = 'rotate(0deg) scale(1)'; }, 280);
            diceEl.textContent = roll;

            const isWin = (choice === 'low' && roll <= 3) || (choice === 'high' && roll >= 4);
            if (isWin) {
                const winAmount = stake * 1.95;
                balance += winAmount;
                updateBalanceDisplay();
                statusEl.innerHTML = `<span class="text-emerald-400">G'alaba! Kubik: ${roll} (+${formatUZS(winAmount)} UZS)</span>`;
                showToast(`Tabriklaymiz! +${formatUZS(winAmount)} UZS yutdingiz!`);
                logMiniGameHistory('Muzli Kubik', stake, 1.95, winAmount);
            } else {
                statusEl.innerHTML = `<span class="text-rose-400">Kubik ${roll} tushdi. Yana urinib ko'ring!</span>`;
                showToast(`Kubik ${roll} tushdi.`, "error");
                logMiniGameHistory('Muzli Kubik', stake, 0, 0);
            }
        }

        function playSnowPenalty(dir) {
            const stake = parseFloat(document.getElementById('penalty-stake').value) || 0;
            if (stake < 1000) return showToast("Minimal stavka 1 000 UZS!", "error");
            if (stake > balance) return showToast("Balansda mablag' yetarli emas!", "error");

            balance -= stake;
            updateBalanceDisplay();

            const dirs = ['left', 'center', 'right'];
            const keeperDir = dirs[Math.floor(Math.random() * dirs.length)];
            const keeperEl = document.getElementById('penalty-keeper');
            const resEl = document.getElementById('penalty-result');

            if (keeperDir === 'left') keeperEl.style.transform = 'translateX(-45px) rotate(-15deg)';
            else if (keeperDir === 'right') keeperEl.style.transform = 'translateX(45px) rotate(15deg)';
            else keeperEl.style.transform = 'translateX(0px) scale(1.2)';

            if (dir !== keeperDir) {
                const winAmount = stake * 2.75;
                balance += winAmount;
                updateBalanceDisplay();
                resEl.innerHTML = `<span class="text-emerald-400">GOOOOL! ⚽ (+${formatUZS(winAmount)} UZS)</span>`;
                showToast(`GOOOL! +${formatUZS(winAmount)} UZS yutdingiz!`);
                logMiniGameHistory('Qorli Penalti', stake, 2.75, winAmount);
            } else {
                resEl.innerHTML = `<span class="text-rose-400">SEYV! 🧤 Darvozabon zarbani qaytardi!</span>`;
                showToast("Darvozabon to'pni qaytardi!", "error");
                logMiniGameHistory('Qorli Penalti', stake, 0, 0);
            }
        }

        function spinFrostWheel() {
            if (isWheelSpinning) return;
            const stake = parseFloat(document.getElementById('wheel-stake').value) || 0;
            if (stake < 1000) return showToast("Minimal stavka 1 000 UZS!", "error");
            if (stake > balance) return showToast("Balansda mablag' yetarli emas!", "error");

            isWheelSpinning = true;
            balance -= stake;
            updateBalanceDisplay();

            const sectors = [0, 1.5, 2, 0, 1.5, 3, 0, 5];
            const picked = sectors[Math.floor(Math.random() * sectors.length)];
            wheelAngle += 720 + Math.floor(Math.random() * 360);

            const wheelEl = document.getElementById('frost-wheel');
            wheelEl.style.transform = `rotate(${wheelAngle}deg)`;

            setTimeout(() => {
                isWheelSpinning = false;
                const resEl = document.getElementById('wheel-result');
                if (picked > 0) {
                    const winAmount = stake * picked;
                    balance += winAmount;
                    updateBalanceDisplay();
                    resEl.innerHTML = `<span class="text-emerald-400 font-extrabold">Natija: ${picked}x (+${formatUZS(winAmount)} UZS)</span>`;
                    showToast(`Muz G‘ildiragi ${picked}x berdi! +${formatUZS(winAmount)} UZS`);
                    logMiniGameHistory('Muz G‘ildiragi', stake, picked, winAmount);
                } else {
                    resEl.innerHTML = `<span class="text-rose-400 font-bold">Natija: 0x. Yana aylantirib ko'ring!</span>`;
                    showToast("0x sektor tushdi.", "error");
                    logMiniGameHistory('Muz G‘ildiragi', stake, 0, 0);
                }
            }, 1000);
        }

                        <i class="fa-solid fa-snowflake text-3xl text-sky-300/40 mb-2"></i>
                        <p class="text-sm font-bold text-white">Hali tarix bo'sh</p>
                        <p class="text-xs text-sky-200/60 mt-1">Sport o'yinlariga stavka tiking yoki tezkor o'yinlarni sinab ko'ring.</p>
                        <button type="button" onclick="navigateTo('sports', 'football')" class="mt-4 px-4 py-2 rounded-xl bg-gradient-to-r from-sky-100 to-ice text-obsidian text-xs font-extrabold">O'yinlarga o'tish</button>
                    </div>
                `;
                container.innerHTML = html;
                return;
            }

            historyLog.forEach(item => {
                html += `
                <div class="glass-card rounded-2xl p-3.5 space-y-2">
                    <div class="flex items-center justify-between border-b border-sky-200/15 pb-1.5">
                        <div>
                            <span class="text-xs font-extrabold text-ice">${item.id}</span>
                            <span class="text-[10px] text-sky-200/60 ml-2">${item.time}</span>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-sky-400/10 text-sky-200 border border-sky-200/20">
                            ${item.type === 'sport' ? 'Sport Kupon' : 'Tezkor O‘yin'}
                        </span>
                    </div>
                    <div class="text-xs font-bold text-white">${item.title}</div>
                    <div class="bg-[#050c18] rounded-xl p-2.5 flex justify-between items-center text-xs border border-sky-200/15">
                        <div>
                            <div class="text-[10px] text-sky-200/60">Stavka</div>
                            <div class="font-bold text-white">${formatUZS(item.stake)} UZS</div>
                        </div>
                        <div class="text-center">
                            <div class="text-[10px] text-sky-200/60">Koeff</div>
                            <div class="font-extrabold text-ice">${item.odd}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] text-sky-200/60">Natija</div>
                            <div class="font-extrabold ${item.statusColor}">${item.resultText}</div>
                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- INITIALIZE APP ---
        window.onload = function() {
            initSnowfall();
            updateBalanceDisplay();
            selectCategory('football');
        };
    </script>
</body>
</html>
